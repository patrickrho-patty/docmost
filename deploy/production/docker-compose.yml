# Patty KB — production compose (contabo-japan)
#
# The docmost and patty-kb-mcp services run PIPELINE-BUILT images from Harbor.
# The digests on the `image:` lines below are OWNED BY KARGO — written by the production Stage's
# yaml-update step on every promotion. Never hand-edit it (one exception: the
# initial bootstrap commit).
#
# The box converges automatically: a systemd timer pulls this repo and runs
#   docker compose -f deploy/production/docker-compose.yml pull && up -d
# only when a new commit landed. See deploy/README.md.
#
# env_file is ../../.env = /opt/docmost/.env (untracked, survives git resets).
# Secrets (POSTGRES_PASSWORD, APP_SECRET, OPENAI_API_KEY, ...) stay there.
#
# AI stack (PAT-2329):
#   - embeddings: ollama service below (bge-m3, CPU-only, network-internal)
#   - completions: MiniMax OpenAI-compatible endpoint (OPENAI_API_URL in .env)
name: docmost   # project pin — adopts the existing docmost_* containers/volumes

services:
  docmost:
    # ⚠️ Kargo-owned line (yaml-update: services.docmost.image)
    image: registry.patty.io/patty-kb/docmost@sha256:771ca849206048d7240d5fabe6d6e207909bd2e8838587f0367821fdc6a52235
    container_name: docmost
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - NODE_ENV=production
    volumes:
      - docmost-data:/app/data/storage
    networks:
      - omniroute_default
    depends_on:
      - docmost-db
      - docmost-redis
      - ollama
  docmost-db:
    # pgvector build of postgres:18 — required for AI semantic search (page_embeddings)
    image: pgvector/pgvector:pg18
    container_name: docmost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - docmost-db-data:/var/lib/postgresql
    networks:
      - omniroute_default
  docmost-redis:
    image: redis:8-alpine
    container_name: docmost-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - docmost-redis-data:/data
    networks:
      - omniroute_default
  ollama:
    image: ollama/ollama:latest
    container_name: docmost-ollama
    restart: unless-stopped
    environment:
      # keep bge-m3 resident — cold load is ~11s, warm embed ~350ms
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - omniroute_default
    # no published ports: reachable only inside the docker network as ollama:11434
  patty-kb-mcp:
    # ⚠️ Kargo-owned line (yaml-update: services.patty-kb-mcp.image)
    # Built by .github/workflows/patty-kb-mcp-image.yml on GARM and pushed to
    # Harbor; the digest below is the only place a deploy version is declared,
    # so rollback is changing it. Never hand-edit it (one exception: the
    # initial bootstrap commit).
    image: registry.patty.io/patty-kb/patty-kb-mcp@sha256:ed0c1b372dd510fb0c391dc8994ff24ae2baf5403d3eb3ec19f4767da8ae58c5
    # The container name is Caddy's upstream (patty-kb-mcp:8080) — do not change.
    container_name: patty-kb-mcp
    restart: unless-stopped
    environment:
      - PATTY_KB_URL=https://kb.patty.io
      - PATTY_KB_RESOURCE_URL=https://mcp.kb.patty.io
      - PATTY_KB_ISSUER=https://login.patty.io/realms/internal
      - PATTY_KB_ALLOWED_HOSTS=mcp.kb.patty.io
    networks:
      - omniroute_default
    # no published ports: reachable only inside the docker network as patty-kb-mcp:8080
volumes:
  docmost-data:
  docmost-db-data:
  docmost-redis-data:
  ollama-models:
networks:
  omniroute_default:
    external: true
    name: omniroute_default
