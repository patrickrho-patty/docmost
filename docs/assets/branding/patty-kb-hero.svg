<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.35" stop-color="#7dd3fc"/>
      <stop offset="0.7" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#18181b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- the search path through the knowledge graph -->
    <path id="p1" d="M 214 214 L 296 168"/>
    <path id="p2" d="M 296 168 L 402 208"/>
    <path id="p3" d="M 402 208 L 508 158"/>
    <path id="p4" d="M 508 158 L 604 196"/>
    <path id="p5" d="M 296 168 L 356 246"/>
    <path id="p6" d="M 402 208 L 470 250"/>
    <path id="travel" d="M 214 214 L 296 168 L 402 208 L 508 158 L 604 196" fill="none"/>
  </defs>

  <!-- card -->
  <rect width="760" height="300" rx="16" fill="#09090b"/>
  <rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="759" height="299" rx="16" fill="none" stroke="#27272a"/>

  <!-- wordmark + tagline -->
  <text x="380" y="62" text-anchor="middle" fill="#fafafa" font-size="32" letter-spacing="16" font-weight="600">PATTY KB</text>
  <text x="380" y="90" text-anchor="middle" fill="#a1a1aa" font-size="13.5" letter-spacing="2" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">묻는 순간, 지식이 이어진다</text>

  <!-- edges: base -->
  <g stroke="#27272a" stroke-width="1.5" fill="none">
    <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/><use href="#p6"/>
  </g>

  <!-- edges: gradient light that chases the pulse -->
  <g stroke="url(#grad)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <use href="#p1" stroke-dasharray="8 140" stroke-dashoffset="148"><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="0.15s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="6.15s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="12.15s" fill="freeze"/></use>
    <use href="#p2" stroke-dasharray="8 148" stroke-dashoffset="156"><animate attributeName="stroke-dashoffset" values="156;-4" dur="0.75s" begin="1.05s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="156;-4" dur="0.75s" begin="7.05s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="156;-4" dur="0.75s" begin="13.05s" fill="freeze"/></use>
    <use href="#p3" stroke-dasharray="8 140" stroke-dashoffset="148"><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="1.95s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="7.95s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="148;-4" dur="0.75s" begin="13.95s" fill="freeze"/></use>
    <use href="#p4" stroke-dasharray="8 138" stroke-dashoffset="146"><animate attributeName="stroke-dashoffset" values="146;-4" dur="0.75s" begin="2.85s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="146;-4" dur="0.75s" begin="8.85s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="146;-4" dur="0.75s" begin="14.85s" fill="freeze"/></use>
    <use href="#p5" stroke-dasharray="8 124" stroke-dashoffset="132"><animate attributeName="stroke-dashoffset" values="132;-4" dur="0.7s" begin="1.35s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="132;-4" dur="0.7s" begin="7.35s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="132;-4" dur="0.7s" begin="13.35s" fill="freeze"/></use>
    <use href="#p6" stroke-dasharray="8 92" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;-4" dur="0.6s" begin="2.25s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="100;-4" dur="0.6s" begin="8.25s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="100;-4" dur="0.6s" begin="14.25s" fill="freeze"/></use>
  </g>

  <!-- drifting embedding particles -->
  <g opacity="0.55">
    <circle r="1.8" fill="#7dd3fc"><animateMotion dur="9s" begin="-1s" repeatCount="indefinite" path="M 296 168 L 402 208 L 508 158"/></circle>
    <circle r="1.6" fill="#c4b5fd"><animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite" path="M 196 214 L 296 168 L 356 246"/></circle>
    <circle r="1.8" fill="#5eead4"><animateMotion dur="10s" begin="-3s" repeatCount="indefinite" path="M 402 208 L 470 250"/></circle>
    <circle r="1.6" fill="#f0abfc"><animateMotion dur="12s" begin="-8s" repeatCount="indefinite" path="M 508 158 L 604 196"/></circle>
  </g>

  <!-- the traveling pulse -->
  <g filter="url(#glow)">
    <circle r="4" fill="#e0f2fe">
      <animateMotion dur="3.9s" begin="0s" repeatCount="indefinite" path="M 214 214 L 296 168 L 402 208 L 508 158 L 604 196"/>
    </circle>
  </g>
  <circle r="9" fill="#93c5fd" opacity="0.35" filter="url(#halo)">
    <animateMotion dur="3.9s" begin="0s" repeatCount="indefinite" path="M 214 214 L 296 168 L 402 208 L 508 158 L 604 196"/>
  </circle>

  <!-- query node: a search bar with a blinking caret -->
  <g transform="translate(162,214)">
    <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#0f0f13" stroke="#7dd3fc" stroke-opacity="0.55"/>
    <circle cx="-34" cy="0" r="6" fill="none" stroke="#7dd3fc" stroke-opacity="0.9" stroke-width="1.6"/>
    <line x1="-29.5" y1="4.5" x2="-25" y2="9" stroke="#7dd3fc" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="3" x2="30" y2="3" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="-8" x2="36" y2="8" stroke="#a5b4fc" stroke-width="2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- document nodes -->
  <!-- n2 -->
  <g transform="translate(296,168)">
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="#0f0f13" stroke="#27272a"/>
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="none" stroke="url(#grad)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.6;0" keyTimes="0;0.26;0.32;0.5;0.62" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="-22" y1="-5" x2="6" y2="-5" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- n3 -->
  <g transform="translate(402,208)">
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="#0f0f13" stroke="#27272a"/>
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="none" stroke="url(#grad)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.6;0" keyTimes="0;0.44;0.5;0.66;0.78" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="-22" y1="-5" x2="10" y2="-5" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- n4 -->
  <g transform="translate(508,158)">
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="#0f0f13" stroke="#27272a"/>
    <rect x="-34" y="-16" width="68" height="32" rx="7" fill="none" stroke="url(#grad)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.6;0" keyTimes="0;0.6;0.66;0.8;0.9" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="-22" y1="-5" x2="2" y2="-5" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- n5: the answer page -->
  <g transform="translate(604,196)">
    <circle r="26" fill="#93c5fd" opacity="0.18" filter="url(#halo)">
      <animate attributeName="opacity" values="0;0;0.35;0.12;0" keyTimes="0;0.72;0.8;0.92;0.99" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.7;0.7;1.25;0.9;0.7" keyTimes="0;0.72;0.82;0.92;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-36" y="-18" width="72" height="36" rx="8" fill="#0f0f13" stroke="url(#grad)" stroke-width="1.4"/>
    <line x1="-24" y1="-6" x2="4" y2="-6" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="-24" y1="3" x2="24" y2="3" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-24" y1="10" x2="12" y2="10" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- n6, n7: nearby pages touched by the wave -->
  <g transform="translate(356,246)">
    <rect x="-30" y="-14" width="60" height="28" rx="7" fill="#0f0f13" stroke="#27272a"/>
    <rect x="-30" y="-14" width="60" height="28" rx="7" fill="none" stroke="url(#grad)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.5;0" keyTimes="0;0.3;0.36;0.5;0.6" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="-18" y1="-4" x2="8" y2="-4" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(470,250)">
    <rect x="-30" y="-14" width="60" height="28" rx="7" fill="#0f0f13" stroke="#27272a"/>
    <rect x="-30" y="-14" width="60" height="28" rx="7" fill="none" stroke="url(#grad)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.5;0" keyTimes="0;0.44;0.5;0.62;0.72" dur="6s" repeatCount="indefinite"/>
    </rect>
    <line x1="-18" y1="-4" x2="4" y2="-4" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="380" y="286" text-anchor="middle" fill="#3f3f46" font-size="10" letter-spacing="4">KB.PATTY.IO</text>
</svg>
