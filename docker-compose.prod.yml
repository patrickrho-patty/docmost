# Patty KB — production compose (contabo-japan, vmi3404035)
#
# Deploy layout on the box:
#   /opt/docmost/           — this repo's source copy + this compose + .env (secrets, not committed)
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets (POSTGRES_PASSWORD, APP_SECRET, OPENAI_API_KEY, ...) live in /opt/docmost/.env
# and are referenced here via ${...} — never commit real values.
#
# AI stack (PAT-2329):
#   - embeddings: ollama service below (bge-m3, CPU-only, network-internal, no published ports)
#   - completions: MiniMax OpenAI-compatible endpoint (OPENAI_API_URL in .env)
services:
  docmost:
    build: .
    container_name: docmost
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - docmost-data:/app/data/storage
    networks:
      - omniroute_default
    depends_on:
      - docmost-db
      - docmost-redis
      - ollama
  docmost-db:
    # pgvector build of postgres:18 — required for AI semantic search (page_embeddings)
    image: pgvector/pgvector:pg18
    container_name: docmost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - docmost-db-data:/var/lib/postgresql
    networks:
      - omniroute_default
  docmost-redis:
    image: redis:8-alpine
    container_name: docmost-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - docmost-redis-data:/data
    networks:
      - omniroute_default
  ollama:
    image: ollama/ollama:latest
    container_name: docmost-ollama
    restart: unless-stopped
    environment:
      # keep bge-m3 resident — cold load is ~11s, warm embed ~350ms
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - omniroute_default
    # no published ports: reachable only inside the docker network as ollama:11434
volumes:
  docmost-data:
  docmost-db-data:
  docmost-redis-data:
  ollama-models:
networks:
  omniroute_default:
    external: true
    name: omniroute_default
